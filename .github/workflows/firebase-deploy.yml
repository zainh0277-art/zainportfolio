name: Validate and deploy portfolio
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://zainportfolio-007.web.app' }}
      - name: Install browser checks
        run: npm install --no-save --package-lock=false playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Check responsive layouts and contact form
        run: |
          python3 -m http.server 4173 --directory out &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/check-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static
          path: out
  deploy:
    name: Deploy to Firebase Hosting
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-static
          path: out
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAINPORTFOLIO_007 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_ZAINPORTFOLIO_007 secret."
            exit 1
          fi
          CREDENTIALS_PATH="$(mktemp)"
          trap 'rm -f "$CREDENTIALS_PATH"' EXIT
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_PATH"
          elif printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode | jq -e . >/dev/null 2>&1; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > "$CREDENTIALS_PATH"
          else
            echo "::error::Invalid Firebase credential. Replace repository secret FIREBASE_SERVICE_ACCOUNT_ZAINPORTFOLIO_007 with the complete downloaded service-account JSON file contents, including both braces. Do not paste a filename, Firebase web config, or only the private key."
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_PATH"
          npx firebase-tools@latest deploy --only hosting --project zainportfolio-007 --non-interactive
